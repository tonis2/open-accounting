services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_URL: postgres://accounting:${POSTGRES_PASSWORD}@postgres:5432/accounting?sslmode=disable
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy

  envoy:
    image: docker.io/envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    command: envoy -c /etc/envoy/envoy.yaml --disable-hot-restart
    environment:
      ENVOY_UID: "0"   # lets the image start under rootless podman
    volumes:
      - ./server/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro,z
    depends_on:
      - server

  web:
    build: ./dashboard
    restart: unless-stopped
    # Rootless podman cannot bind ports below 1024: set WEB_HTTP_PORT=8080 / WEB_HTTPS_PORT=8443 in .env
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - envoy

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
